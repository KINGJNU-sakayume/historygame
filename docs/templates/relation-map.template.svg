<!--
  관계도 템플릿 (docs/EPISODE_GUIDE.md 7.1). 실제 지형·나침반·실제 배치를 쓰지 않는다.
  원 크기 = 국력(반지름 18~26 / 36~46 / 48~56), 맞닿은 원 = 국경을 맞댄 나라, 점선 원 = 바다 건너 먼 곳.
  플레이어의 나라만 #f2b530. 선: 진군=굵은 점선+화살표, 봉쇄·압박=실선+화살표, 이동=흐린 점선+화살표.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" font-family="'IBM Plex Sans KR', sans-serif" aria-label="TODO 관계도를 문장으로: A는 B와 국경을 맞대고 …">
  <title>판세 관계도</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2733"/>
    </marker>
  </defs>
  <rect width="400" height="330" fill="#eef1ee"/>

  <!-- 세력: 원 (A = 플레이어, 맞닿게 놓으면 국경을 맞댄 나라) -->
  <circle cx="160" cy="160" r="24" fill="#f2b530" stroke="#1f2733" stroke-width="1.5"/>
  <circle cx="234" cy="160" r="50" fill="#e3e8e4" stroke="#1f2733" stroke-width="1.5"/>
  <circle cx="70" cy="70" r="30" fill="#eef1ee" stroke="#1f2733" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 행동: 진군 (B → A) -->
  <path d="M220 140 C 205 145 195 152 186 156" fill="none" stroke="#1f2733" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#head)"/>
  <!-- 행동: 거리/항로 (A … C) -->
  <path d="M144 142 C 120 115 100 95 88 88" fill="none" stroke="#57616d" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round"/>

  <g font-weight="600" fill="#1f2733" text-anchor="middle">
    <text x="160" y="166" font-size="17">A</text>
    <text x="250" y="166" font-size="20">B</text>
    <text x="70" y="76" font-size="16">C</text>
  </g>
  <g font-size="9.5" fill="#57616d" text-anchor="middle">
    <text x="160" y="198">우리</text>
    <text x="250" y="184">TODO 짧은 설명</text>
    <text x="70" y="114">TODO</text>
  </g>
  <text x="200" y="320" font-size="9" fill="#57616d" text-anchor="middle">원 크기는 국력, 맞닿은 원은 국경을 맞댄 나라. 위치는 실제 지리와 무관하다.</text>
</svg>
