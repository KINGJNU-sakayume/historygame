<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 583" role="img" font-family="'IBM Plex Sans KR', sans-serif" aria-label="1866년 7월의 중부 유럽. 왼쪽은 프로이센군이 쾨니히그레츠와 파르두비체를 거쳐 남쪽 모라비아로 진군한 방향과 니콜스부르크의 협상 장소를 보여 준다. 빈은 그 남쪽이며 점령하지 않았다. 오른쪽은 전쟁 전 영토의 대략적 개관이다.">
