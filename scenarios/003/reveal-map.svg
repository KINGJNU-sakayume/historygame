<rect x="18" y="48" width="452" height="435.1" fill="none" stroke="#c3cac6"/>
<rect x="492" y="48" width="240" height="258.2" fill="none" stroke="#c3cac6"/>
<text x="18" y="28" font-size="14" font-weight="600" fill="#1f2733">보헤미아·모라비아, 1866년 7월</text>
<text x="492" y="28" font-size="12" font-weight="600" fill="#1f2733">중부 유럽 개관, 전쟁 전 영토</text>
<text x="492" y="330.2" font-size="10" fill="#57616d">형광: 프로이센의 전쟁 전 영토</text>
<text x="492" y="350.2" font-size="10" fill="#57616d">굵은 점선: A군의 주요 진군 방향</text>
<text x="492" y="370.2" font-size="10" fill="#57616d">가는 점선: B군의 재집결 방향</text>
<text x="492" y="390.2" font-size="10" fill="#57616d">실선: 도나우강</text>
<text x="492" y="410.2" font-size="10" fill="#57616d">빈의 원: 수도 위치, 점령 표시는 아님</text>
<text x="492" y="430.2" font-size="10" fill="#57616d">부대별 세부 이동 경로는 생략했다.</text>
<text x="18" y="549" font-size="10" fill="#57616d">해안선은 단순화했다. 국경과 하천도 개략이며 당시의 정밀 작전도가 아니다.</text>
<text x="18" y="567" font-size="10" fill="#57616d">니콜스부르크 남쪽의 빈에는 입성하지 않았다. 지도는 병합 결과가 아니라 종전 직전의 공간 관계를 보여 준다.</text>
</svg>
