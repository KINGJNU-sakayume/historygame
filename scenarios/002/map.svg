<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" font-family="'IBM Plex Sans KR', sans-serif" aria-label="A는 C의 지배지와 국경을 맞댄다. 바다 건너 B는 A에 영토 양도를 제안하고 C는 양도권에 항의한다. B와 D는 전쟁 중이다.">
  <title>영토 양도와 통상권을 둘러싼 네 세력의 관계도</title>
  <defs><marker id="e2head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f2733"/></marker><marker id="e2move" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57616d"/></marker></defs>
  <rect width="400" height="330" fill="#eef1ee"/>
  <circle cx="103" cy="82" r="52" fill="#f3f5f2" stroke="#1f2733" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="303" cy="82" r="52" fill="#f3f5f2" stroke="#1f2733" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="199" cy="235" r="38" fill="#f2b530" stroke="#1f2733" stroke-width="1.5"/>
  <circle cx="283" cy="235" r="46" fill="#f3f5f2" stroke="#1f2733" stroke-width="1.5"/>
  <path d="M158 73 L245 73" fill="none" stroke="#1f2733" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#e2head)"/>
  <path d="M246 90 L160 90" fill="none" stroke="#1f2733" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#e2head)"/>
  <text x="202" y="55" text-anchor="middle" font-size="11" fill="#1f2733">전쟁</text>
  <path d="M111 137 Q121 188 170 207" fill="none" stroke="#57616d" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#e2move)"/>
  <text x="67" y="177" font-size="10.5" fill="#57616d">영토 양도 제안</text>
  <path d="M266 188 Q245 154 213 193" fill="none" stroke="#1f2733" stroke-width="1.6" marker-end="url(#e2head)"/>
  <text x="276" y="170" font-size="10.5" fill="#1f2733">양도권 항의</text>
  <g text-anchor="middle" font-weight="600" fill="#1f2733"><text x="103" y="87" font-size="22">B</text><text x="303" y="87" font-size="22">D</text><text x="199" y="240" font-size="20">A</text><text x="283" y="240" font-size="21">C</text></g>
  <g text-anchor="middle" font-size="10" fill="#57616d"><text x="103" y="110">매각 제안</text><text x="303" y="110">B와 전쟁 중</text><text x="199" y="291">우리</text><text x="293" y="255">현지 관리</text></g>
  <text x="200" y="319" font-size="8.7" fill="#57616d" text-anchor="middle">원 크기는 국력, 맞닿은 원은 국경을 맞댄 나라. 위치는 실제 지리와 무관하다.</text>
</svg>
