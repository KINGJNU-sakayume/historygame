<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 500" role="img" font-family="'IBM Plex Sans KR', sans-serif" aria-label="북아메리카 동부의 실제 지리 개관, 1803년. 미국은 미시시피강 동쪽에 있고 뉴올리언스는 강 하구에 있다. 루이지애나는 강 서쪽의 양도 대상이며 당시 스페인이 관리했다. 국경과 강은 단순화했고 양도 영토의 불확정 경계선은 그리지 않았다.">
<title>미시시피강과 뉴올리언스, 1803년</title>
<defs><clipPath id="e2panel"><rect x="25" y="50" width="640" height="370"/></clipPath><marker id="e2river" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57616d"/></marker></defs>
<rect width="690" height="500" fill="#eef1ee"/><text x="25" y="29" font-size="16" font-weight="600" fill="#1f2733">북아메리카 동부, 1803년</text><g clip-path="url(#e2panel)"><rect x="25" y="50" width="640" height="370" fill="#cfd8dc"/>
<path d="M25.0 50.0 L531.6 50.0 L531.6 102.9 L510.5 116.1 L510.5 129.3 L489.3 142.5 L468.2 168.9 L478.8 175.5 L447.1 182.1 L436.6 188.8 L426.0 221.8 L415.5 235.0 L415.5 254.8 L394.4 274.6 L373.3 301.1 L362.7 320.9 L368.0 353.9 L368.0 387.0 L362.7 393.6 L352.2 367.1 L346.9 347.3 L341.6 334.1 L320.5 327.5 L299.4 323.5 L278.3 327.5 L267.7 340.7 L257.2 336.8 L236.1 330.1 L215.0 334.1 L193.9 367.1 L193.9 393.6 L183.3 420.0 L25.0 420.0 Z" fill="#e6eae7" stroke="#1f2733" stroke-width="1"/>
<path d="M215.0 76.4 L215.0 89.6 L246.6 89.6 L267.7 89.6 L278.3 96.2 L320.5 109.5 L331.0 109.5 L346.9 122.7 L346.9 168.9 L383.8 155.7 L404.9 142.5 L426.0 129.3 L463.0 129.3 L463.0 102.9 L484.1 98.9 L502.0 102.9 L510.5 129.3 L489.3 142.5 L468.2 168.9 L478.8 175.5 L447.1 182.1 L436.6 188.8 L426.0 221.8 L415.5 235.0 L415.5 254.8 L394.4 274.6 L373.3 301.1 L362.7 314.3 L257.2 314.3 L255.1 287.9 L259.3 261.4 L276.2 235.0 L265.6 211.2 L254.0 188.8 L255.1 168.9 L246.6 142.5 L236.1 129.3 L215.0 102.9 Z" fill="#f2b530" stroke="#1f2733" stroke-width="1"/>
<path d="M236.1 129.3 L246.6 142.5 L255.1 168.9 L254.0 188.8 L265.6 211.2 L276.2 235.0 L259.3 261.4 L255.1 287.9 L257.2 314.3 L266.7 327.5 L275.1 339.4" fill="none" stroke="#57616d" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#e2river)"/>
</g><rect x="25" y="50" width="640" height="370" fill="none" stroke="#c3cac6"/>
<text x="362.7" y="221.8" font-size="17" text-anchor="middle" fill="#1f2733">미국<tspan font-size="9" dy="-5">A</tspan></text>
<text x="130.5" y="168.9" font-size="17" text-anchor="middle" fill="#1f2733">루이지애나</text>
<text x="130.5" y="195.4" font-size="11" text-anchor="middle" fill="#1f2733">프랑스<tspan font-size="9" dy="-4">B</tspan><tspan dy="4"> 양도권 주장</tspan></text>
<text x="130.5" y="215.2" font-size="11" text-anchor="middle" fill="#1f2733">스페인<tspan font-size="9" dy="-4">C</tspan><tspan dy="4"> 현지 관리</tspan></text>
<text x="130.5" y="235.0" font-size="10" text-anchor="middle" fill="#57616d">양도 범위의 경계선은 생략</text>
<text x="236.1" y="248.2" font-size="11" text-anchor="end" fill="#1f2733">미시시피강</text>
<text x="236.1" y="265.4" font-size="9" text-anchor="end" fill="#57616d">점선: 하구로 향하는 수운</text>
<circle cx="267.0" cy="328.2" r="3.5" fill="#1f2733"/>
<text x="275.1" y="350.0" font-size="12" text-anchor="start" fill="#1f2733">뉴올리언스</text>
<text x="257.2" y="388.3" font-size="13" text-anchor="middle" fill="#57616d">멕시코만</text>
<text x="457.7" y="301.1" font-size="13" text-anchor="middle" fill="#57616d">대서양</text>
<text x="341.6" y="373.8" font-size="9" text-anchor="end" fill="#1f2733">플로리다 · 스페인<tspan font-size="8" dy="-4">C</tspan></text>
<text x="25" y="444" font-size="11" fill="#1f2733">바다 건너: 프랑스ᴮ는 영토를 매각하고 영국ᴰ와 전쟁 중이다.</text>
<text x="25" y="465" font-size="10" fill="#57616d">형광은 매입 전 미국. 해안선·국경·강은 단순화했다. 당시 국경의 확정도가 아니다.</text>
<text x="25" y="482" font-size="10" fill="#57616d">점선은 하구로 향하는 수운 방향이며, 특정 선박의 실제 항적을 뜻하지 않는다.</text>
</svg>
