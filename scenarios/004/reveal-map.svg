<text x="134.8" y="108.4" text-anchor="middle" fill="#1f2733" font-size="16" font-weight="600">미국<tspan font-size="0.65em" dy="-0.4em">A</tspan></text>
<text x="200.4" y="155.4" text-anchor="middle" fill="#57616d" font-size="10" font-weight="400">플로리다</text>
<text x="209.0" y="374.6" text-anchor="middle" fill="#1f2733" font-size="16" font-weight="600">쿠바<tspan font-size="0.65em" dy="-0.4em">C</tspan></text>
<text x="362.8" y="161.6" text-anchor="middle" fill="#57616d" font-size="10" font-weight="400">소련발 해상 반입 방향</text>
<text x="362.8" y="178.8" text-anchor="middle" fill="#57616d" font-size="9" font-weight="400">여러 항구로 향한 흐름의 개략</text>
<text x="374.2" y="296.3" text-anchor="middle" fill="#57616d" font-size="12" font-weight="400">대서양</text>
<text x="303.0" y="130.3" text-anchor="middle" fill="#57616d" font-size="10" font-weight="400">바하마</text>
<text x="385.7" y="435.7" text-anchor="middle" fill="#57616d" font-size="9" font-weight="400">히스파니올라</text>
