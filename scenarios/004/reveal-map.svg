<text x="654.0" y="73.0" text-anchor="middle" fill="#1f2733" font-size="13" font-weight="600">소련<tspan font-size="0.65em" dy="-0.4em">B</tspan></text>
<text x="602.1" y="164.3" text-anchor="middle" fill="#1f2733" font-size="12" font-weight="600">튀르키예<tspan font-size="0.65em" dy="-0.4em">D</tspan></text>
<text x="583.5" y="100.1" text-anchor="middle" fill="#57616d" font-size="11" font-weight="400">흑해</text>
<rect x="18" y="52" width="456" height="407.2" fill="none" stroke="#c3cac6"/>
<rect x="500" y="52" width="232" height="154.3" fill="none" stroke="#c3cac6"/>
<text x="18" y="28" font-size="14" font-weight="600" fill="#1f2733">쿠바와 미국 남동부, 1962년 10월</text>
<text x="500" y="28" font-size="12" font-weight="600" fill="#1f2733">튀르키예의 미국 기지, 1962년</text>
<text x="500" y="234.3" font-size="10" fill="#57616d">튀르키예는 소련과 국경을 맞댔다.</text>
<text x="500" y="255.3" font-size="10" fill="#57616d">이곳의 미국 미사일도 협상 쟁점이었다.</text>
<text x="500" y="276.3" font-size="10" fill="#57616d">기지의 개별 위치·사거리는 표시하지 않는다.</text>
<text x="500" y="297.3" font-size="10" fill="#57616d"></text>
<text x="500" y="318.3" font-size="10" fill="#57616d">형광: 미국 영토</text>
<text x="500" y="339.3" font-size="10" fill="#57616d">흐린 점선: 무기의 해상 반입 방향</text>
<text x="500" y="360.3" font-size="10" fill="#57616d">선박별 항적·실제 초계선은 표시하지 않음</text>
<text x="500" y="381.3" font-size="10" fill="#57616d">양쪽 패널의 축척은 서로 다르다.</text>
<text x="18" y="535" font-size="10" fill="#57616d">해안선은 단순화했다. 국경도 개략이며 항해·사격·초계에 쓸 수 있는 지도가 아니다.</text>
<text x="18" y="553" font-size="10" fill="#57616d">점선은 소련발 물자 흐름의 방향이다. 하바나 한 항구의 특정 수송 항로를 뜻하지 않는다.</text>
</svg>
