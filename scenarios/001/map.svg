<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" font-family="'IBM Plex Sans KR', sans-serif" aria-label="판세 관계도: A는 D와 국경을 맞대고, D는 B와 맞닿아 있다. B의 군대가 D를 지나 A로 진군한다. C의 함대가 A의 항구를 봉쇄하고, F의 함대가 A의 항구에 정박해 있다. E는 대양 건너 A의 식민지다.">
  <title>판세 관계도</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2733"/>
    </marker>
  </defs>

  <rect width="400" height="330" fill="#eef1ee"/>

  <!-- 관계선: 행동 -->
  <!-- F 함대가 A의 항구에 정박 -->
  <path d="M314 60 C 270 80 210 100 170 146" fill="none" stroke="#57616d" stroke-width="1.4" stroke-dasharray="2 4" marker-end="url(#head)"/>
  <text x="262" y="104" font-size="10" fill="#57616d">F 함대, A의 항구에 정박</text>

  <!-- A와 E: 대양 건너 -->
  <path d="M134 144 C 110 120 90 100 70 76" fill="none" stroke="#57616d" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round"/>
  <text x="80" y="128" font-size="10" fill="#57616d" transform="rotate(48 80 128)">대양 건너</text>

  <!-- C 함대가 A의 항구를 봉쇄 -->
  <path d="M96 232 C 112 210 124 196 134 181" fill="none" stroke="#1f2733" stroke-width="2" marker-end="url(#head)"/>
  <text x="18" y="200" font-size="10" fill="#1f2733">C 함대가</text>
  <text x="18" y="213" font-size="10" fill="#1f2733">A의 항구 봉쇄</text>

  <!-- 원: 크기는 국력, 맞닿으면 국경을 맞댄 나라 -->
  <circle cx="289" cy="213" r="52" fill="#e3e8e4" stroke="#1f2733" stroke-width="1.5"/>
  <circle cx="214" cy="160" r="40" fill="#e3e8e4" stroke="#1f2733" stroke-width="1.5"/>
  <circle cx="150" cy="160" r="24" fill="#f2b530" stroke="#1f2733" stroke-width="1.5"/>
  <circle cx="64" cy="262" r="46" fill="#e3e8e4" stroke="#1f2733" stroke-width="1.5"/>
  <circle cx="48" cy="50" r="26" fill="#eef1ee" stroke="#1f2733" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="330" cy="48" r="18" fill="#e3e8e4" stroke="#1f2733" stroke-width="1.5"/>

  <!-- B의 군대가 D를 지나 A로 -->
  <path d="M262 196 C 236 182 210 168 178 162" fill="none" stroke="#1f2733" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#head)"/>

  <!-- 기호와 짧은 설명 -->
  <g font-weight="600" fill="#1f2733" text-anchor="middle">
    <text x="150" y="166" font-size="17">A</text>
    <text x="214" y="146" font-size="17">D</text>
    <text x="289" y="214" font-size="20">B</text>
    <text x="64" y="268" font-size="20">C</text>
    <text x="48" y="56" font-size="16">E</text>
    <text x="330" y="54" font-size="14">F</text>
  </g>
  <g font-size="9.5" fill="#57616d" text-anchor="middle">
    <text x="150" y="198">우리</text>
    <text x="214" y="214">B의 동맹</text>
    <text x="289" y="232">대륙의 제국</text>
    <text x="64" y="284">A의 옛 동맹</text>
    <text x="48" y="90">A의 식민지</text>
    <text x="330" y="22">B의 동맹</text>
  </g>
  <text x="262" y="140" font-size="10" fill="#1f2733" font-weight="600">B군 진군, D를 지나</text>

  <text x="200" y="320" font-size="9" fill="#57616d" text-anchor="middle">원 크기는 국력, 맞닿은 원은 국경을 맞댄 나라. 위치는 실제 지리와 무관하다.</text>
</svg>
